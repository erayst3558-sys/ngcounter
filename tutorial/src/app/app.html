<h1 class="title">Counter App</h1>
<div>
    <h3 class="count">{{ count }}</h3>
    <div style="text-align:center">
        <button class="btn bg-red" (click)="handleDecrement()">Decrement</button>
        <button class="btn bg-green" (click)="handleIncrement()">Increment</button>
        <button class="btn bg-black" (click)="handleReset()">Reset</button>
    </div>
</div>
